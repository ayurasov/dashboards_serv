[project]
name = "dashboards-server"
version = "0.1.0"
description = "Дашборды компании — сервер"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*", "ignore::DeprecationWarning:openpyxl.*"]
markers = ["postgres: проверки на PostgreSQL (нужен TEST_POSTGRES_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/0001_*.py", "migrations/versions/000[5-9]_*.py", "migrations/versions/001[01]_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
