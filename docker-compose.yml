version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dashboards_serv
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Persist SQLite DB outside the container
      - db_data:/data
      # Optional: mount tp-report seed JSON at runtime if not baked into image
      # - ./tp-report/seed_data.json:/data/tp_seed_data.json:ro
    environment:
      DATABASE_URL: sqlite:////data/hr_dashboard.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db_data:
