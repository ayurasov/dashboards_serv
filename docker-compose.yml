# Дашборды компании: приложение + PostgreSQL.
#   cp .env.example .env   # задайте SECRET_KEY, POSTGRES_PASSWORD, ADMIN_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboards}
      POSTGRES_USER: ${POSTGRES_USER:-dashboards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}", "-c", "shared_buffers=256MB"]

  app:
    build: .
    image: dashboards:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dashboards}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dashboards}
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env (openssl rand -hex 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_DATA: ${DEMO_DATA:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      LOG_JSON: ${LOG_JSON:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

volumes:
  pg_data:
