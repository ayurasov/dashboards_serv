# Дашборды компании: приложение, планировщик (worker) и PostgreSQL.
#   cp .env.example .env   # задайте SECRET_KEY, POSTGRES_PASSWORD, ADMIN_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboards}
      POSTGRES_USER: ${POSTGRES_USER:-dashboards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}", "-c", "shared_buffers=256MB"]

  app:
    build: .
    image: dashboards:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dashboards}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dashboards}
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env (openssl rand -hex 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_DATA: ${DEMO_DATA:-false}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
      DB_QUEUE_TIMEOUT: ${DB_QUEUE_TIMEOUT:-30}
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      LOG_JSON: ${LOG_JSON:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Адрес «Дашбордов» для ссылок наружу (Confluence, комментарии «По Делу»); пусто — без ссылок
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Вход по учётной записи домена; остальные AUTH_LDAP_* и AD_SYNC_* — в docker-compose.override.yml
      AUTH_LDAP_ENABLED: ${AUTH_LDAP_ENABLED:-false}
      AUTH_LDAP_URL: ${AUTH_LDAP_URL:-}
      AUTH_LDAP_BASE_DN: ${AUTH_LDAP_BASE_DN:-}
      AUTH_LDAP_BIND_DN: ${AUTH_LDAP_BIND_DN:-}
      AUTH_LDAP_BIND_PASSWORD: ${AUTH_LDAP_BIND_PASSWORD:-}
      # Входящие данные и интеграции (ADR-0011): папка «Входящие» — том inbox, общий с планировщиком
      INBOX_DIR: ${INBOX_DIR:-/data/inbox}
      INBOX_SETTLE_SECONDS: ${INBOX_SETTLE_SECONDS:-10}
      INBOX_MAX_MB: ${INBOX_MAX_MB:-20}
      INBOX_RETENTION_DAYS: ${INBOX_RETENTION_DAYS:-90}
      INBOUND_RATE_LIMIT: ${INBOUND_RATE_LIMIT:-120}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # Разрешённые узлы подключений: «jira.company.ru» или «.company.ru» (домен и поддомены); пусто — любые
      PODELU_ALLOWED_HOSTS: ${PODELU_ALLOWED_HOSTS:-}
      PULS_ALLOWED_HOSTS: ${PULS_ALLOWED_HOSTS:-}
      JIRA_ALLOWED_HOSTS: ${JIRA_ALLOWED_HOSTS:-}
      CONFLUENCE_ALLOWED_HOSTS: ${CONFLUENCE_ALLOWED_HOSTS:-}
      BITRIX24_ALLOWED_HOSTS: ${BITRIX24_ALLOWED_HOSTS:-}
      EXCHANGE_ALLOWED_HOSTS: ${EXCHANGE_ALLOWED_HOSTS:-}
      ONEC_ALLOWED_HOSTS: ${ONEC_ALLOWED_HOSTS:-}
    volumes:
      - inbox:/data/inbox

  # Планировщик: папка «Входящие», запуски подключений по расписанию, срок хранения.
  # Тот же образ; миграции выполняет только app — worker ждёт актуальную схему и не мигрирует сам.
  worker:
    image: dashboards:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["python", "-m", "app.cli", "worker"]
    environment: *app-environment
    volumes:
      - inbox:/data/inbox
    # У планировщика нет HTTP-сервера; признак работы — «Планировщик» на экране «Входящие → Папка»
    healthcheck:
      disable: true
    # SIGTERM: текущий такт (разбор файла, запуск подключения) доделывается
    stop_grace_period: 60s

volumes:
  pg_data:
  inbox:
