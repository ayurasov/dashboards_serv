              properties:
                apply:
                  default: false
                  title: Apply
                  type: boolean
                content:
                  maxLength: 10000000
                  title: Content
                  type: string
              required:
              - content
              title: ValuesImportIn
              type: object
          multipart/form-data:
            schema:
              properties:
                apply:
                  type: boolean
                file:
                  format: binary
                  type: string
              type: object
      responses:
